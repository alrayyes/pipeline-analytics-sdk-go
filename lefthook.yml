pre-commit:
  parallel: false
  commands:
    gitleaks:
      run: gitleaks git --staged --redact --no-banner
    gofmt:
      glob: "*.go"
      run: ./scripts/go-docker.sh gofmt -w {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

# gitleaks scans the whole history rather than the unpushed range: it takes
# well under a second at this size, and CI does the same (rules/secrets.md).
pre-push:
  parallel: false
  commands:
    gitleaks:
      run: gitleaks git --redact --no-banner
    go-mod-tidy:
      run: ./scripts/go-docker.sh sh -c "go mod tidy -diff"
    go-vet:
      run: ./scripts/go-docker.sh go vet ./...
    go-test:
      run: ./scripts/go-docker.sh go test -race ./...
    golangci-lint:
      run: ./scripts/golangci-lint-docker.sh run ./...
