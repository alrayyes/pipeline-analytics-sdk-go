openapi: 3.1.0
info:
  title: pipeline-analytics API
  version: "1.0.0"
  description: >
    Self-hosted CI pipeline analytics for GitHub Actions and Forgejo Actions.
    Every endpoint except the WebAuthn ceremony and the forge webhook
    receivers requires an authenticated session or a bearer API token (see
    dashboard-auth/spec.md); token issuance and revocation require a
    session specifically.
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0-only
servers:
  - url: /
    # Public: the dashboard and the API are one binary, reachable by whoever
    # can reach it. Declared for OWASP API9 (inventory management).
    x-internal: false

security:
  - sessionCookie: []
  - apiKey: []

paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness -- the process is up and answering HTTP
      description: >
        Public and unauthenticated, and deliberately checks nothing else: it
        stays 200 while the database is down, so a liveness probe never
        restarts a process over a dependency it can't fix. Use `/readyz` to
        learn whether the instance can actually serve.
      tags: [meta]
      security: []
      responses:
        "200":
          description: The process is alive
          content:
            text/plain:
              schema:
                type: string
                examples: [ok]

  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness -- the instance can serve, its database answers
      description: >
        Public and unauthenticated, for the container's `HEALTHCHECK` and
        any orchestrator. Reads the database schema within a short deadline and
        reuses the result for a few seconds, so polling can't hammer the
        database. A failure returns 503 with a generic body: the cause goes to
        the server log, not to an unauthenticated caller. After SIGTERM it
        returns 503 without checking, while the server keeps serving for its
        drain period, so a router takes the instance out of rotation before
        the listener closes.
      tags: [meta]
      security: []
      responses:
        "200":
          description: The database answered
          content:
            text/plain:
              schema:
                type: string
                examples: [ok]
        "503":
          description: The database did not answer in time or errored, or the instance is shutting down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/version:
    get:
      operationId: getVersion
      summary: The running server's build version
      description: >
        Public and unauthenticated -- the dashboard's own footer fetches
        this to render a version chip linking to that release's notes.
      tags: [meta]
      security: []
      responses:
        "200":
          description: Build version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"

  /api/mcp:
    post:
      operationId: mcpEndpoint
      summary: MCP server (Streamable HTTP transport)
      description: >
        Serves an MCP server over the Streamable HTTP transport
        (mcp-endpoint/spec.md), exposing the same pipeline health,
        trend, flaky-step, and usage data as read-only MCP tools. The
        request and response bodies are MCP's own JSON-RPC 2.0
        envelope, not a REST payload -- this entry documents the
        endpoint for discoverability and auth, not for REST client
        generation.
      tags: [mcp]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: An MCP JSON-RPC 2.0 request or notification.
      responses:
        "200":
          description: >
            An MCP JSON-RPC 2.0 response, or an event stream of them
            (text/event-stream) per the Streamable HTTP transport.
          content:
            application/json:
              schema:
                type: object
                description: An MCP JSON-RPC 2.0 response.
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/repos:
    get:
      operationId: listRepos
      summary: List tracked repositories
      tags: [repos]
      parameters:
        - $ref: "#/components/parameters/RepoForgeFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of tracked repositories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: registerRepo
      summary: Register a repository for tracking
      description: >
        Stores the supplied token encrypted at rest and creates a webhook on
        the repository (forge-ingestion/spec.md's "Repo tracking
        registration" and "Webhook registration on tracking").
      tags: [repos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoRegistration"
      responses:
        "201":
          description: Repository registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/forge-tokens:
    get:
      operationId: listForgeTokens
      summary: The forge tokens saved for registering repositories
      description: >
        Session-only. Returns each saved token in its masked form only
        (`****1234`); no endpoint returns the token itself. At most one token
        is saved per forge and, for Forgejo, per instance URL.
      tags: [repos]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Every saved token, masked
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/SavedForgeToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: saveForgeToken
      summary: Save a forge token, replacing the one for that forge and instance
      description: >
        Session-only. Stores the token encrypted at rest, like a repo's token.
        Saving for a forge and instance that already has one replaces it. The
        token isn't checked against the forge here: registering with it is
        what finds out whether it works.
      tags: [repos]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveForgeTokenRequest"
      responses:
        "200":
          description: Saved, masked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedForgeToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/forge-tokens/{tokenId}:
    delete:
      operationId: deleteForgeToken
      summary: Delete a saved forge token
      description: >
        Session-only. Repos already registered with it keep their own copy and
        keep working: a saved token is a convenience for the next
        registration, not a link from the repos that used it.
      tags: [repos]
      security:
        - sessionCookie: []
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/repos/identifiers:
    get:
      operationId: listRepoIdentifiers
      summary: List every tracked identifier for a forge, unpaginated
      description: >
        Backs Discover's "already tracked" check, which needs to see every
        tracked repo regardless of how many are tracked, not just whatever
        page a paginated GET /api/repos happens to be showing (see
        forge-ingestion/spec.md's "Repo tracking registration").
      tags: [repos]
      parameters:
        - name: forge
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Forge"
        - name: forgejoInstanceUrl
          in: query
          required: false
          description: Restricts to one Forgejo instance. Ignored for GitHub.
          schema:
            type: string
      responses:
        "200":
          description: Every tracked identifier matching forge (+ instance, for Forgejo)
          content:
            application/json:
              schema:
                type: object
                required: [identifiers]
                properties:
                  identifiers:
                    type: array
                    items:
                      type: string
                    example: ["alrayyes/pipeline-analytics"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/repos/discover:
    post:
      operationId: discoverRepos
      summary: List repositories a not-yet-registered token can access
      description: >
        Lets the registration UI offer a picker instead of asking the user
        to type "owner/name" by hand. The token is used for this one lookup
        and never stored.
      tags: [repos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoDiscoveryRequest"
      responses:
        "200":
          description: Repositories accessible to the token
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["alrayyes/pipeline-analytics"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/repos/{repoId}:
    delete:
      operationId: untrackRepo
      summary: Stop tracking a repository
      description: >
        Removes the repo and cascades to its stored runs, jobs, and steps.
        Does not attempt to delete the webhook created on the forge at
        registration time.
      tags: [repos]
      parameters:
        - $ref: "#/components/parameters/RepoId"
      responses:
        "204":
          description: Repository untracked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/repos/{repoId}/usage:
    get:
      operationId: getRepoUsage
      summary: Runner-minutes usage per workflow for a repository
      tags: [repos]
      parameters:
        - $ref: "#/components/parameters/RepoId"
        - $ref: "#/components/parameters/Window"
      responses:
        "200":
          description: Usage broken down by workflow
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsageEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/pipelines:
    get:
      operationId: listPipelines
      summary: A page of tracked pipelines and their health status
      tags: [pipelines]
      parameters:
        - $ref: "#/components/parameters/PipelineRepoIdFilter"
        - $ref: "#/components/parameters/RepoForgeFilter"
        - $ref: "#/components/parameters/PipelineHealthFilter"
        - $ref: "#/components/parameters/PipelineSort"
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: >
            A page of tracked pipelines, ordered by `sort` (by repoId then name
            unless stated). `health` and `sort` apply across every matching
            pipeline before paging, so `hasMore` is accurate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/pipelines/{pipelineId}:
    get:
      operationId: getPipeline
      summary: Duration and failure-rate trend for one pipeline
      tags: [pipelines]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
        - $ref: "#/components/parameters/Window"
      responses:
        "200":
          description: Pipeline detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/pipelines/{pipelineId}/steps:
    get:
      operationId: getPipelineSteps
      summary: Step breakdown -- duration ranking, queue/exec split, failure rate, flaky flag
      tags: [pipelines]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
        - $ref: "#/components/parameters/Window"
      responses:
        "200":
          description: >
            Steps ordered by duration contribution, highest first
            (pipeline-metrics/spec.md's "Slowest-step ranking").
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Step"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/pipelines/{pipelineId}/flaky-runs:
    get:
      operationId: listFlakyRuns
      summary: Every run in which one named step failed, most-recent-first
      description: >
        The step-scoped drill-down from a flaky (or previously flaky) step
        in GET .../steps -- lets a click land on the run that actually
        failed instead of an aggregate link that may point at a run which
        has since passed. Available regardless of the pipeline's current
        health status, since a step's failures can age out of the live
        window before anyone gets a chance to look.
      tags: [pipelines]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
        - $ref: "#/components/parameters/StepName"
        - $ref: "#/components/parameters/Window"
      responses:
        "200":
          description: >
            Runs in which the named step failed, most-recent-first. Empty
            when the step has no failed occurrence in the window.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlakyRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/runs/{runId}/steps:
    get:
      operationId: getRunSteps
      summary: One run's own steps and their statuses
      description: >
        What a flaky run in GET .../flaky-runs drills down into -- scoped
        to a single run, so each step's forgeUrl points at the exact job
        that ran, never a different occurrence of the same step name.
      tags: [pipelines]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run's steps, in recorded order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/runs/{runId}/rerun:
    post:
      operationId: rerunRun
      summary: Ask the forge to re-run a concluded run
      description: >
        Session-only: an API token can't, and there is no MCP tool, because
        this writes to the forge. Re-runs only the failed jobs when the run
        failed and the whole run otherwise. The forge does the work, so `202`
        means it accepted the request, not that the run has finished. Needs a
        stored token with write access to Actions: GitHub answers a read-only
        token with `403 forbidden`, and the message says which permission is
        missing. A Forgejo run is `501 unsupported`, since Forgejo has no REST
        endpoint for it (found by search, not checked against a live
        instance). The token is never logged.
      tags: [pipelines]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: The forge accepted the request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotActionable"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/runs/{runId}/cancel:
    post:
      operationId: cancelRun
      summary: Ask the forge to cancel a queued or running run
      description: >
        Session-only, no MCP tool, same reasons and same outcomes as the
        re-run. A run that has already concluded is `409 not_actionable`.
        GitHub's cancel endpoint needs the `repo` scope on a classic token; for
        a fine-grained token this assumes Actions write, as for the re-run,
        which the documentation search did not state for this endpoint.
      tags: [pipelines]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: The forge accepted the request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotActionable"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/runs/{runId}/jobs/{jobId}/log:
    get:
      operationId: getJobLog
      summary: The tail of one job's log, fetched from the forge on demand
      description: >
        Fetches the log from the originating forge when asked and never stores
        it, so the SQLite file doesn't grow with log volume and a log can't
        outlive the forge's own retention. Returns the last `lines` lines (200
        by default). ANSI escape sequences are passed through untouched: the
        client renders and escapes them, and must never insert a line as
        HTML. A forge with no log API (Forgejo before v16, which has none),
        an expired log, or a token without access answers `200` with
        `available: false` and a `reason`, so the client can say so and still
        show `forgeUrl`. An unknown run or job is `404`. GitHub's log URL is a
        redirect that expires after a minute, so it is followed server-side
        and never handed to the client.
      tags: [pipelines]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: jobId
          in: path
          required: true
          schema:
            type: string
          description: A `jobId` from GET /api/runs/{runId}/steps.
        - name: lines
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        "200":
          description: The log tail, or why there isn't one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/insights/github-rate-limit:
    get:
      operationId: getGitHubRateLimitInsights
      summary: GitHub REST API rate-limit usage, grouped by token
      description: >
        One entry per distinct GitHub token this app holds (not per repo --
        the same token often tracks more than one repo), with the repos it
        covers and the token's most recently observed rate-limit status.
        That status is read from a real API response's X-RateLimit-*
        headers rather than a dedicated poll, per GitHub's own guidance
        (docs.github.com/en/rest/using-the-rest-api/rate-limits-for-the-rest-api)
        -- `status` is absent until a request has actually been made with
        that token (reconciliation polling, or webhook/discovery calls).
      tags: [insights]
      responses:
        "200":
          description: GitHub token usage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GitHubTokenUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/steps/unhealthy:
    get:
      operationId: listUnhealthySteps
      summary: A page of pipelines with a flaky or failing step, grouped by pipeline
      tags: [pipelines]
      parameters:
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: >
            A page of pipeline groups, ordered by (repoId, pipelineName), one
            entry per pipeline with at least one flaky or failing step; a
            fully healthy pipeline contributes nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnhealthyStepsList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/steps/flaky:
    get:
      operationId: listFlakySteps
      summary: Flaky steps across every pipeline, ranked by flake rate, each with its recent run results
      description: >
        Backs the flaky telemetry view. A step is listed when it is flagged
        flaky within the window. `flakeRate` is the fraction of the step's
        runs in the window that failed; `runCount` is how many runs that is.
        `recentOutcomes` is the step's result in its most recent runs
        (at most 40), oldest first, so a client draws the matrix without
        interpreting status strings. Ordered by `flakeRate` descending, then
        `runCount` descending, then pipeline and step name.
      tags: [insights]
      parameters:
        - $ref: "#/components/parameters/PipelineRepoIdFilter"
        - $ref: "#/components/parameters/RepoForgeFilter"
        - $ref: "#/components/parameters/BranchFilter"
        - $ref: "#/components/parameters/InsightsWindow"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of flaky steps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlakyStepList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/branches:
    get:
      operationId: listBranches
      summary: The branches that have runs in a window, busiest first
      description: >
        What a branch selector offers: every branch with at least one run that
        started in the trailing window, with how many. A run with no recorded
        branch is not a branch. Ordered by `runCount` descending, then name.
        Pass a name as `branch` to the failure insights, the run list or the
        flaky steps to scope them.
      tags: [insights]
      parameters:
        - $ref: "#/components/parameters/PipelineRepoIdFilter"
        - $ref: "#/components/parameters/RepoForgeFilter"
        - $ref: "#/components/parameters/InsightsWindow"
      responses:
        "200":
          description: The branches with runs in the window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/insights/failures:
    get:
      operationId: getFailureInsights
      summary: Failure aggregates over a window -- pass rate, MTTR, failure distribution, root-cause groups
      description: >
        Backs the failure overview and root-cause views. "Stage" means
        step: forges expose workflows, jobs and steps but no stage
        taxonomy, so the distribution and the groups are by failing step
        name. `passRateDelta` compares against the preceding window of
        equal length. Failure categories are heuristic (step conclusion
        and name), never log-derived; a failure no rule matches is
        `uncategorised`.
      tags: [insights]
      parameters:
        - $ref: "#/components/parameters/PipelineRepoIdFilter"
        - $ref: "#/components/parameters/RepoForgeFilter"
        - $ref: "#/components/parameters/BranchFilter"
        - $ref: "#/components/parameters/InsightsWindow"
      responses:
        "200":
          description: Failure insights for the window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureInsights"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/runs:
    get:
      operationId: listRuns
      summary: A page of runs, newest first, each with its steps for a stage progression bar
      tags: [pipelines]
      parameters:
        - $ref: "#/components/parameters/PipelineRepoIdFilter"
        - $ref: "#/components/parameters/RepoForgeFilter"
        - $ref: "#/components/parameters/BranchFilter"
        - $ref: "#/components/parameters/RunStatusFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of runs ordered by start time, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/settings:
    get:
      operationId: getSettings
      summary: The dashboard account's persisted UI settings
      description: >
        Every setting is always present in the response, each one either
        an explicitly-stored value or its documented default -- never
        null or missing.
      tags: [settings]
      responses:
        "200":
          description: Every setting, fully resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateSettings
      summary: Update one or more settings
      description: >
        A key present with a value sets it. A key present with JSON
        null clears it, reverting to its documented default on the
        next read -- this is also how the Pipelines page's "Reset
        filters" works: a single PATCH setting
        pipelinesHealthFilter/pipelinesRepoSelector/pipelinesSortOrder
        to null. A key absent from the body is left untouched. An
        invalid key or an enum value outside its documented set
        rejects the whole request; nothing already stored changes.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Every setting, fully resolved, after applying the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/auth/register/options:
    post:
      operationId: webauthnRegisterOptions
      summary: Begin WebAuthn credential registration (first run only)
      tags: [auth]
      security: []
      responses:
        "200":
          description: >
            WebAuthn PublicKeyCredentialCreationOptions. The Set-Cookie header
            carries an opaque, server-side ceremony reference (not the
            session itself) that the subsequent POST /api/auth/register call
            must present back to complete the ceremony it belongs to.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCreationOptions"
        "409":
          description: A user account already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/register:
    post:
      operationId: webauthnRegister
      summary: Complete WebAuthn credential registration
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnAttestationResponse"
      responses:
        "201":
          description: Account created, session established
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: A user account already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/auth/login/options:
    post:
      operationId: webauthnLoginOptions
      summary: Begin WebAuthn login
      tags: [auth]
      security: []
      responses:
        "200":
          description: >
            WebAuthn PublicKeyCredentialRequestOptions. The Set-Cookie header
            carries an opaque, server-side ceremony reference (not the
            session itself) that the subsequent POST /api/auth/login call
            must present back to complete the ceremony it belongs to.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnRequestOptions"
        "404":
          description: No account has been registered yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login:
    post:
      operationId: webauthnLogin
      summary: Complete WebAuthn login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnAssertionResponse"
      responses:
        "200":
          description: Session established
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          description: Assertion did not verify
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/auth/logout:
    post:
      operationId: webauthnLogout
      summary: End the current session
      tags: [auth]
      responses:
        "204":
          description: Session ended
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/tokens:
    post:
      operationId: issueApiToken
      summary: Issue a new API token
      description: >
        Session-only -- an API token can't be used to issue another one.
        The raw token value is returned once, here, and is never
        recoverable afterward.
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "201":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiToken"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/tokens/{tokenId}:
    delete:
      operationId: revokeApiToken
      summary: Revoke an API token
      description: Session-only, same reasoning as issuing one.
      tags: [auth]
      security:
        - sessionCookie: []
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/auth/credentials/options:
    post:
      operationId: addCredentialOptions
      summary: Begin an authenticated "add another passkey" ceremony
      description: >
        Session-only -- an API token can't enroll another credential on the
        account any more than it can mint another token. Distinct from
        POST /api/auth/register/options: that ceremony is the anonymous
        first-run registration and only ever runs once per account; this
        one runs from within an existing session and excludes credentials
        already registered to it.
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: >
            WebAuthn PublicKeyCredentialCreationOptions. The Set-Cookie header
            carries an opaque, server-side ceremony reference (not the
            session itself) that the subsequent POST /api/auth/credentials
            call must present back to complete the ceremony it belongs to.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCreationOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/credentials:
    get:
      operationId: listCredentials
      summary: List the account's registered credentials
      description: Session-only, same reasoning as addCredentialOptions.
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Every credential registered to the account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credential"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: addCredential
      summary: Complete the "add another passkey" ceremony
      description: Session-only, same reasoning as addCredentialOptions.
      tags: [auth]
      security:
        - sessionCookie: []
      parameters:
        - name: label
          in: query
          required: false
          description: >
            A caller-supplied name for the new credential (e.g. "MacBook",
            "iPhone"), shown in the credential list. Defaults to an empty
            label if omitted.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnAttestationResponse"
      responses:
        "201":
          description: Credential added
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/auth/credentials/{credentialId}:
    delete:
      operationId: revokeCredential
      summary: Revoke a credential
      description: >
        Session-only, same reasoning as addCredentialOptions. Rejected with
        409 if credentialId is the account's last remaining credential --
        revoking it would leave the account with no way to log in.
      tags: [auth]
      security:
        - sessionCookie: []
      parameters:
        - name: credentialId
          in: path
          required: true
          description: The credential's id, base64url-encoded.
          schema:
            type: string
      responses:
        "204":
          description: Credential revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: credentialId is the account's last remaining credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /webhooks/github:
    post:
      operationId: githubWebhook
      summary: GitHub Actions webhook receiver (workflow_run / workflow_job events)
      tags: [webhooks]
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: HMAC-SHA256 signature over the raw request body, keyed by the repository's webhook secret.
          schema:
            type: string
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: GitHub's workflow_run or workflow_job event payload.
      responses:
        "202":
          description: Accepted -- signature verified, event queued for ingestion
        "401":
          description: Signature missing or invalid; payload discarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /webhooks/forgejo:
    post:
      operationId: forgejoWebhook
      summary: Forgejo Actions webhook receiver
      tags: [webhooks]
      security: []
      parameters:
        - name: X-Forgejo-Signature
          in: header
          required: true
          description: HMAC-SHA256 signature over the raw request body, keyed by the repository's webhook secret.
          schema:
            type: string
        - name: X-Forgejo-Event
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Forgejo's workflow run/job event payload.
      responses:
        "202":
          description: Accepted -- signature verified, event queued for ingestion
        "401":
          description: Signature missing or invalid; payload discarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
    apiKey:
      type: http
      scheme: bearer
      description: >
        A long-lived, revocable token from POST /api/auth/tokens.
        Authenticates the same way sessionCookie does for every endpoint
        except token issuance/revocation, which are session-only.

  parameters:
    RepoId:
      name: repoId
      in: path
      required: true
      schema:
        type: string
    PipelineId:
      name: pipelineId
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    StepName:
      name: step
      in: query
      required: true
      description: A step's name, exactly as GET .../steps reports it.
      schema:
        type: string
    Window:
      name: window
      in: query
      required: false
      description: Trailing run count or duration the trend/ranking is computed over. Defaults to a server-chosen rolling window.
      schema:
        type: string
    InsightsWindow:
      name: window
      in: query
      required: false
      description: >
        Trailing span of time the failure insights cover: `24h`, `7d` or
        `30d`. Unlike `Window`, this is never a run count -- a quiet and a
        busy pipeline would cover very different spans. Anything else falls
        back to `7d`.
      schema:
        type: string
        enum: ["24h", "7d", "30d"]
        default: "7d"
    RepoForgeFilter:
      name: forge
      in: query
      required: false
      description: Restrict the list to one forge. Omitted returns every forge.
      schema:
        $ref: "#/components/schemas/Forge"
    PipelineRepoIdFilter:
      name: repoId
      in: query
      required: false
      description: Restrict the list to one tracked repo. Omitted returns every repo's pipelines.
      schema:
        type: string
    BranchFilter:
      name: branch
      in: query
      required: false
      description: >
        Cover only runs on this branch, matched exactly. Omitted covers every
        branch. A branch with no runs in range is an empty result, not an
        error. Longer than 255 characters is a 400.
      schema:
        type: string
        maxLength: 255
    PipelineHealthFilter:
      name: health
      in: query
      required: false
      description: Restrict the list to pipelines with this health status. Omitted returns every status. An unknown value is a 400.
      schema:
        $ref: "#/components/schemas/HealthStatus"
    PipelineSort:
      name: sort
      in: query
      required: false
      description: >
        Order of the list. `name` (the default) is by repoId then name;
        `lastRun` is most recent run first, a pipeline with no runs last, ties
        by repoId then name. An unknown value is a 400.
      schema:
        type: string
        enum: [name, lastRun]
        default: name
    Limit:
      name: limit
      in: query
      required: false
      description: Max items to return. Omitted returns every matching item, unpaginated.
      schema:
        type: integer
        minimum: 1
    Offset:
      name: offset
      in: query
      required: false
      description: Items to skip before the returned page.
      schema:
        type: integer
        minimum: 0
        default: 0
    RunStatusFilter:
      name: status
      in: query
      required: false
      description: >
        Restrict runs to one status bucket. `failed` is a concluded
        failure, `running` is queued or in progress, `success` is a
        concluded success. Omitted or `all` returns every run.
      schema:
        type: string
        enum: [all, failed, running, success]
        default: all

  responses:
    PayloadTooLarge:
      description: >
        The request body is larger than the limit: 64 KiB for the API and
        the MCP endpoint, 2 MiB for the forge webhook receivers. The body is
        not read past the limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No valid session or API token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No resource with that id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: The originating forge rejected the request or couldn't be reached
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The stored token can't do this; the message says which permission is missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotActionable:
      description: The run's state doesn't allow this (re-running one that hasn't concluded, cancelling one that has)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotImplemented:
      description: The run's forge has no API for this
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: A resource with that identity already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: 'The build''s tagged version (e.g. "v1.2.3"), or "dev" for an untagged local build.'

    SettingsValues:
      type: object
      required:
        [
          theme,
          forgeFilter,
          pipelinesHealthFilter,
          pipelinesRepoSelector,
          pipelinesSortOrder,
          telemetryWindow,
        ]
      properties:
        theme:
          type: string
          enum: [light, dark, system]
        forgeFilter:
          type: string
          enum: [all, github, forgejo]
        pipelinesHealthFilter:
          type: string
          enum: [all, healthy, unhealthy]
        pipelinesRepoSelector:
          type: string
          maxLength: 128
          description: >
            A tracked repo's id, or "all" for every repo -- not
            validated against an enum, since the set of valid values
            changes with what's currently tracked.
        pipelinesSortOrder:
          type: string
          enum: [name, lastRun]
        telemetryWindow:
          type: string
          enum: ["24h", "7d", "30d"]
          description: The trailing span the failure overview, root-cause and flaky views cover. Defaults to 7d.

    Settings:
      description: >
        Every setting in force, plus `defaults`: the server's documented
        default for each, so a client can tell whether a value is the
        default without keeping its own copy.
      allOf:
        - $ref: "#/components/schemas/SettingsValues"
        - type: object
          required: [defaults]
          properties:
            defaults:
              $ref: "#/components/schemas/SettingsValues"

    SettingsUpdate:
      type: object
      description: >
        Every property is optional; an absent one is left untouched. A
        property set to null clears it back to its documented default
        instead of setting it.
      properties:
        theme:
          type: [string, "null"]
          enum: [light, dark, system, null]
        forgeFilter:
          type: [string, "null"]
          enum: [all, github, forgejo, null]
        pipelinesHealthFilter:
          type: [string, "null"]
          enum: [all, healthy, unhealthy, null]
        pipelinesRepoSelector:
          type: [string, "null"]
          maxLength: 128
        pipelinesSortOrder:
          type: [string, "null"]
          enum: [name, lastRun, null]
        telemetryWindow:
          type: [string, "null"]
          enum: ["24h", "7d", "30d", null]

    ApiToken:
      type: object
      required: [id, token, createdAt, expiresAt]
      properties:
        id:
          type: string
          description: >
            Identifies the token for revocation (DELETE
            /api/auth/tokens/{tokenId}) -- not itself a usable credential.
        token:
          type: string
          description: >
            The raw token value. Returned only here, at creation; store it
            now, it can't be retrieved again.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    Credential:
      type: object
      required: [id, label, createdAt, revocable]
      properties:
        id:
          type: string
          description: >
            The credential's id, base64url-encoded -- identifies it for
            revocation (DELETE /api/auth/credentials/{credentialId}), not a
            usable credential itself.
        label:
          type: string
          description: >
            A caller-supplied name (e.g. "MacBook", "iPhone"), set once at
            enrollment. Empty for a credential added before this existed, or
            for the account's original anonymous-registration credential.
        createdAt:
          type: string
          format: date-time
        revocable:
          type: boolean
          description: >
            False only for the account's last remaining credential, which
            DELETE /api/auth/credentials/{credentialId} refuses to revoke
            (409). A hint for clients so they don't apply the rule themselves;
            the server still enforces it.

    Forge:
      type: string
      enum: [github, forgejo]

    IngestionStatus:
      type: string
      enum: [pending, active, degraded]

    Repo:
      type: object
      required: [id, forge, identifier, tokenMasked, ingestionStatus]
      properties:
        id:
          type: string
        forge:
          $ref: "#/components/schemas/Forge"
        identifier:
          type: string
          description: "owner/name on the forge."
        forgejoInstanceUrl:
          type: string
          format: uri
          description: Set only when forge is forgejo.
        tokenMasked:
          type: string
          description: 'The stored token''s display form, e.g. "****1234" (forge-ingestion/spec.md''s "Credential storage" -- never the full value).'
        ingestionStatus:
          $ref: "#/components/schemas/IngestionStatus"
        ingestionStatusReason:
          type: string
          description: Set when ingestionStatus is degraded.

    RepoList:
      type: object
      required: [repos, hasMore]
      properties:
        repos:
          type: array
          items:
            $ref: "#/components/schemas/Repo"
        hasMore:
          type: boolean
          description: True when repos beyond this page match the filter. Always false when limit was omitted.

    SavedForgeToken:
      type: object
      required: [id, forge, tokenMasked]
      properties:
        id:
          type: string
        forge:
          $ref: "#/components/schemas/Forge"
        forgejoInstanceUrl:
          type: string
          format: uri
          maxLength: 2048
          description: Set for Forgejo, absent for GitHub.
        tokenMasked:
          type: string
          description: Last four characters only, e.g. "****1234". The token is never returned.

    SaveForgeTokenRequest:
      type: object
      required: [forge, token]
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        forgejoInstanceUrl:
          type: string
          format: uri
          maxLength: 2048
        token:
          type: string
          minLength: 1
          maxLength: 1024

    RepoRegistration:
      type: object
      required: [forge, identifier]
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        identifier:
          type: string
          maxLength: 200
        forgejoInstanceUrl:
          type: string
          format: uri
          maxLength: 2048
        token:
          type: string
          maxLength: 1024
          description: >
            Repo-scoped personal access token. Never echoed back. Omitted uses
            the token saved for this forge and instance; a `400` with code
            `no_saved_token` when there is none.

    RepoDiscoveryRequest:
      type: object
      required: [forge]
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        forgejoInstanceUrl:
          type: string
          format: uri
          maxLength: 2048
        token:
          type: string
          maxLength: 1024
          description: >
            Never stored by this call -- used for this one lookup only.
            Omitted uses the token saved for this forge and instance; a
            `400` with code `no_saved_token` when there is none.

    HealthStatus:
      type: string
      enum: [healthy, unhealthy]

    PipelineSummary:
      type: object
      required: [id, repoId, name, healthStatus]
      properties:
        id:
          type: string
        repoId:
          type: string
        name:
          type: string
        healthStatus:
          $ref: "#/components/schemas/HealthStatus"
        triggeredSignals:
          type: array
          description: Which signal(s) triggered an unhealthy status (pipeline-metrics/spec.md).
          items:
            type: string
            enum: [failure_rate, duration_regression, flaky_step]
        lastRunAt:
          type: string
          format: date-time
          description: The most recent run's start time. Absent if the pipeline has no runs.

    PipelineList:
      type: object
      required: [pipelines, hasMore]
      properties:
        pipelines:
          type: array
          items:
            $ref: "#/components/schemas/PipelineSummary"
        hasMore:
          type: boolean
          description: True when pipelines beyond this page match the filter. Always false when limit was omitted.

    Trend:
      type: object
      required: [timestamps]
      properties:
        timestamps:
          type: array
          items:
            type: string
            format: date-time
        p50:
          type: array
          items:
            type: number
          description: Seconds. Present on a duration trend.
        p90:
          type: array
          items:
            type: number
          description: Seconds. Present on a duration trend.
        rate:
          type: array
          items:
            type: number
          description: 0-1. Present on a failure-rate trend.

    PipelineDetail:
      allOf:
        - $ref: "#/components/schemas/PipelineSummary"
        - type: object
          properties:
            durationTrend:
              $ref: "#/components/schemas/Trend"
            failureRateTrend:
              $ref: "#/components/schemas/Trend"

    Step:
      type: object
      required:
        [
          id,
          name,
          durationContributionSeconds,
          queueSeconds,
          execSeconds,
          failureRate,
          failureCount,
          flaky,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        durationContributionSeconds:
          type: number
        queueSeconds:
          type: number
        execSeconds:
          type: number
        failureRate:
          type: number
        failureCount:
          type: integer
          description: Times this step failed within the window.
        flaky:
          type: boolean
        forgeUrl:
          type: string
          format: uri
          description: >
            Deep link to one occurrence's log on the originating forge --
            not necessarily one where the step failed. GET
            .../flaky-runs is the reliable way to reach a run the step
            actually failed on.

    PipelineStepsGroup:
      type: object
      required: [pipelineId, pipelineName, repoId, steps]
      properties:
        pipelineId:
          type: string
        pipelineName:
          type: string
        repoId:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"

    UnhealthyStepsList:
      type: object
      required: [groups, hasMore]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStepsGroup"
        hasMore:
          type: boolean
          description: True when pipeline groups beyond this page have an unhealthy step. Always false when limit was omitted.

    FlakyRun:
      type: object
      required: [runId, forgeUrl]
      properties:
        runId:
          type: string
        startedAt:
          type: string
          format: date-time
        forgeUrl:
          type: string
          format: uri
          description: Deep link to the job this step failed in, on this specific run.

    Outcome:
      type: string
      enum: [passed, failed, running, queued, cancelled, skipped, unknown]
      description: >
        What a run's or step's forge state means, computed by the server so no
        client interprets status strings. `failed` covers a `failure` or
        `timed_out` conclusion; a conclusion wins over a stale status;
        `running` and `queued` are work still pending (the run list's
        `running` filter covers both); a state the server doesn't recognise is
        `unknown`, never `passed`.

    RunStep:
      type: object
      required: [name, status, outcome]
      properties:
        jobId:
          type: string
          description: The job this step ran in; pass it to GET /api/runs/{runId}/jobs/{jobId}/log.
        name:
          type: string
        status:
          type: string
        conclusion:
          type: string
        outcome:
          $ref: "#/components/schemas/Outcome"
        forgeUrl:
          type: string
          format: uri
          description: Deep link to this exact occurrence's job on the originating forge.

    JobLog:
      type: object
      required: [available, forgeUrl, lines, truncated]
      properties:
        available:
          type: boolean
          description: False when the forge gave no log; see `reason`. `lines` is then empty.
        reason:
          type: string
          enum: [unsupported, expired, forbidden, unreachable]
          description: >
            Present when `available` is false. `unsupported`: the forge has no
            log API. `expired`: the forge no longer has this log. `forbidden`:
            the stored token can't read it. `unreachable`: the forge didn't
            answer.
        lines:
          type: array
          maxItems: 1000
          items:
            type: string
            maxLength: 4096
          description: >
            The last lines of the log, oldest first, each cut at 4096
            characters. Raw text, ANSI sequences included.
        truncated:
          type: boolean
          description: True when the log had more lines than were returned.
        forgeUrl:
          type: string
          format: uri
          description: Deep link to the job on the forge, always present.

    RunDetail:
      type: object
      required: [runId, steps]
      properties:
        runId:
          type: string
        startedAt:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RunStep"

    RunSummary:
      type: object
      required:
        [id, pipelineId, pipelineName, repoId, status, outcome, actions, steps]
      properties:
        id:
          type: string
        pipelineId:
          type: string
        pipelineName:
          type: string
        repoId:
          type: string
        status:
          type: string
          description: The forge's run status, as recorded.
        conclusion:
          type: string
          description: Absent until the run concludes.
        outcome:
          $ref: "#/components/schemas/Outcome"
        startedAt:
          type: string
          format: date-time
        durationSeconds:
          type: number
          description: Absent while the run is still going or has no recorded end.
        branch:
          type: string
          description: Absent on runs ingested before commit metadata was recorded.
        sha:
          type: string
          description: Head commit SHA. Absent where the forge or an older row lacks it.
        message:
          type: string
          description: First line of the head commit message.
        actor:
          type: string
          description: The triggering user or bot.
        forgeUrl:
          type: string
          format: uri
          description: Deep link to the run on the originating forge.
        actions:
          type: array
          description: >
            What a session may ask the forge to do to this run now: `rerun` for
            a concluded GitHub run, `cancel` for a queued or running one. Empty
            when neither applies, and always empty for a Forgejo run. The same
            rule decides the `409 not_actionable` and `501 unsupported` answers
            of `POST /api/runs/{runId}/rerun` and `/cancel`, which stay
            session-only whoever reads this list.
          items:
            type: string
            enum: [rerun, cancel]
        steps:
          type: array
          description: The run's steps in recorded order.
          items:
            $ref: "#/components/schemas/RunStep"

    RunList:
      type: object
      required: [runs, hasMore]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/RunSummary"
        hasMore:
          type: boolean
          description: True when runs beyond this page match the filter. Always false when limit was omitted.

    FailureCategory:
      type: string
      enum:
        [
          infrastructure,
          code_tests,
          network_timeouts,
          config_secrets,
          uncategorised,
        ]

    StageFailureCount:
      type: object
      required: [step, failures, share]
      properties:
        step:
          type: string
        failures:
          type: integer
        share:
          type: number
          description: Fraction in (0, 1] of all failed-step occurrences in the window; the entries' shares sum to 1.

    CategoryCount:
      type: object
      required: [category, occurrences, share]
      properties:
        category:
          $ref: "#/components/schemas/FailureCategory"
        occurrences:
          type: integer
          description: Failed-step occurrences whose step falls in this category.
        share:
          type: number
          description: Fraction in (0, 1] of all failed-step occurrences in the window; the categories' shares sum to 1.

    FailingPipeline:
      type: object
      required: [pipelineId, pipelineName, repoId, runs, failedRuns]
      properties:
        pipelineId:
          type: string
        pipelineName:
          type: string
        repoId:
          type: string
        runs:
          type: integer
        failedRuns:
          type: integer

    FailureGroup:
      type: object
      required: [step, category, occurrences, pipelines]
      properties:
        step:
          type: string
        category:
          $ref: "#/components/schemas/FailureCategory"
        conclusion:
          type: string
          description: The most common step conclusion in the group, shown so a heuristic category can be checked.
        occurrences:
          type: integer
        pipelines:
          type: array
          description: Pipelines the step failed in, each reachable via GET .../flaky-runs.
          items:
            type: object
            required: [pipelineId, pipelineName]
            properties:
              pipelineId:
                type: string
              pipelineName:
                type: string

    FlakyStepEntry:
      type: object
      required:
        [
          pipelineId,
          pipelineName,
          repoId,
          name,
          flakeRate,
          runCount,
          recentOutcomes,
        ]
      properties:
        pipelineId:
          type: string
        pipelineName:
          type: string
        repoId:
          type: string
        name:
          type: string
        flakeRate:
          type: number
          description: Fraction in (0, 1] of the step's runs in the window that failed.
        runCount:
          type: integer
          description: Runs of this step in the window.
        recentOutcomes:
          type: array
          maxItems: 40
          description: The step's result in its most recent runs, oldest first.
          items:
            $ref: "#/components/schemas/Outcome"

    FlakyStepList:
      type: object
      required: [window, steps, hasMore]
      properties:
        window:
          type: string
          enum: ["24h", "7d", "30d"]
          description: >
            The window these figures cover: the requested one, or the
            server's default. Clients show this rather than assuming a default.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/FlakyStepEntry"
        hasMore:
          type: boolean
          description: True when flaky steps beyond this page exist. Always false when limit was omitted.

    BranchList:
      type: object
      required: [window, branches]
      properties:
        window:
          type: string
          enum: ["24h", "7d", "30d"]
          description: >
            The window these counts cover: the requested one, or the
            server's default.
        branches:
          type: array
          items:
            $ref: "#/components/schemas/BranchEntry"

    BranchEntry:
      type: object
      required: [name, runCount]
      properties:
        name:
          type: string
          maxLength: 255
        runCount:
          type: integer
          description: Runs on this branch that started in the window.

    FailureInsights:
      type: object
      required:
        [
          window,
          totalRuns,
          failedRuns,
          flakyStepRatio,
          stageDistribution,
          categoryBreakdown,
          topFailingPipelines,
          failureGroups,
        ]
      properties:
        window:
          type: string
          enum: ["24h", "7d", "30d"]
          description: >
            The window these figures cover: the requested one, or the
            server's default when the request named none or an unknown one.
            Clients show this rather than assuming a default.
        totalRuns:
          type: integer
        failedRuns:
          type: integer
        passRate:
          type: number
          description: Fraction in [0, 1] of concluded runs that succeeded. Absent when no run concluded in the window, since no data isn't 0%.
        passRateDelta:
          type: number
          description: Percentage points versus the preceding window of equal length. Absent when that window had no runs.
        flakyStepRatio:
          type: number
          description: Fraction in [0, 1] of distinct steps flagged flaky.
        mttrSeconds:
          type: number
          description: Mean time from a pipeline's first failed run to its next successful run. Absent when nothing recovered in the window.
        stageDistribution:
          type: array
          description: Failures by failing step name, highest first.
          items:
            $ref: "#/components/schemas/StageFailureCount"
        categoryBreakdown:
          type: array
          description: Failed-step occurrences by failure category, heaviest first. Empty when nothing failed.
          items:
            $ref: "#/components/schemas/CategoryCount"
        topFailingPipelines:
          type: array
          description: Pipelines ordered by failed runs, highest first.
          items:
            $ref: "#/components/schemas/FailingPipeline"
        failureGroups:
          type: array
          description: Failed steps grouped by name, highest occurrence count first.
          items:
            $ref: "#/components/schemas/FailureGroup"

    UsageEntry:
      type: object
      required: [workflow, runnerMinutes]
      properties:
        workflow:
          type: string
        runnerMinutes:
          type: number

    RateLimitStatus:
      type: object
      required: [limit, remaining, used, resetAt]
      properties:
        limit:
          type: integer
          description: Requests allowed per hour for this resource (usually "core").
        remaining:
          type: integer
        used:
          type: integer
        resetAt:
          type: string
          format: date-time

    GitHubTokenUsage:
      type: object
      required: [tokenMasked, repos]
      properties:
        tokenMasked:
          type: string
          description: Last four characters only, e.g. "****1234".
        repos:
          type: array
          items:
            type: string
          description: "owner/name identifiers of every repo tracked under this token."
        status:
          $ref: "#/components/schemas/RateLimitStatus"

    WebAuthnCreationOptions:
      type: object
      description: A WebAuthn PublicKeyCredentialCreationOptions (opaque to the client beyond browser API use).
    WebAuthnRequestOptions:
      type: object
      description: A WebAuthn PublicKeyCredentialRequestOptions (opaque to the client beyond browser API use).
    WebAuthnAttestationResponse:
      type: object
      description: The browser's AuthenticatorAttestationResponse, JSON-encoded.
    WebAuthnAssertionResponse:
      type: object
      description: The browser's AuthenticatorAssertionResponse, JSON-encoded.
