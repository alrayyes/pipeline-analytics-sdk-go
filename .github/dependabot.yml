version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
    groups:
      go-minor-patch:
        update-types: [minor, patch]
      go-major:
        update-types: [major]
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # commitlint tooling only -- nothing here ships in the Go module.
      prefix: chore
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]
  # The stub Dockerfile that pins gitleaks for .github/workflows/gitleaks.yml.
  # Dependabot doesn't read a workflow's `container:`, and the workflow builds
  # this file instead. ci: because it changes the pipeline, not what ships.
  - package-ecosystem: docker
    directory: /.github/gitleaks
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      gitleaks:
        patterns: ["*"]
        update-types: [minor, patch]
      gitleaks-major:
        patterns: ["*"]
        update-types: [major]
