# Deliberately ungated: a secret can be committed to any file, so there is no
# diff this is safe to skip for. No `paths:` filter, unlike prose.yml.
name: gitleaks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Pinned by digest. The image's entrypoint is gitleaks, so clear it to get a
    # shell back for the steps below.
    container:
      image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      options: --entrypoint ""
    steps:
      # The image has no node, which checkout needs.
      - run: apk add --no-cache nodejs
      # fetch-depth: 0, or there is no history to walk and the job passes
      # having scanned nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A fresh clone in a container owned by another user trips git's safe.directory.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The history is small, so scan all of it every time (rules/secrets.md).
      - run: gitleaks git --redact --no-banner
