name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: go vet
        run: ./scripts/go-docker.sh go vet ./...
      - name: go mod tidy -diff
        run: ./scripts/go-docker.sh sh -c "go mod tidy -diff"
      - name: go test
        run: >-
          ./scripts/go-docker.sh sh -c
          "go run gotest.tools/gotestsum@v1.13.0 --junitfile junit.xml --
          -race -coverprofile=coverage.out ./..."
      - name: Reports assemble into the published layout
        run: ./scripts/build-reports.test.sh
      - name: Upload coverage/test-result reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            coverage.out
            junit.xml

  # Codecov's upload needs CODECOV_TOKEN to exist to succeed at all on this
  # account's protected default branch, and that secret is a known-pending
  # manual step (same shape as every other Codecov-gated repo here) -- kept
  # out of the required `test` job so a missing token can't block every
  # future merge, including release-please's own release PR (confirmed live
  # on pipeline-analytics-sdk-node: bundling this into a required check did
  # exactly that).
  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reports
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: true
      - name: Upload test results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: true

  # Contract-test the client against a mock server built from the same
  # pinned spec, per rules/sdk-generation.md's "testing against the spec,
  # not a hand-written stub". Runs go test directly (actions/setup-go)
  # rather than through scripts/go-docker.sh: that script's container has
  # no route to Prism's container on "localhost", where a bare runner
  # process reaches a docker run -p-published port directly -- same
  # approach hush-hush-go's own contract job already uses.
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start Prism mock from the pinned spec
        run: |
          docker run -d --name prism -p 4010:4010 \
            -v "$(pwd)/openapi/openapi.yaml:/spec/openapi.yaml:ro" \
            stoplight/prism:5 mock -h 0.0.0.0 -m false /spec/openapi.yaml
          # -m false: Prism's default multiprocess (Node cluster) mode
          # crashes on startup in this image -- confirmed on hush-hush-go,
          # same fix applies here.
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4010 >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Run contract tests against the mock
        run: go test -tags=contract ./contract/...
        env:
          PIPELINE_ANALYTICS_BASE_URL: http://localhost:4010
      - name: Prism logs
        if: failure()
        run: docker logs prism

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: gofmt
        run: >-
          ./scripts/go-docker.sh sh -c
          "test -z \"$(gofmt -l .)\" || (gofmt -l . && exit 1)"
      - name: golangci-lint
        run: ./scripts/golangci-lint-docker.sh run ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: govulncheck
        run: >-
          ./scripts/go-docker.sh sh -c
          "go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./..."

  generated-code-is-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Regenerating from the pinned spec reproduces the committed client
        run: |
          ./hack/fetch-spec.sh
          ./scripts/go-docker.sh sh -c \
            "go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
             -generate types,client -package genclient \
             -o internal/genclient/client.gen.go openapi/openapi.yaml"
          git diff --exit-code openapi/openapi.yaml internal/genclient/client.gen.go

  # Publishes the test and coverage reports to
  # apis.ryankes.eu/pipeline-analytics-sdk-go/reports/. The artifact mirrors
  # that path under _site/ because apis.ryankes.eu is a Pages user site and
  # serves every project as a subpath. Waits on every required job and runs
  # on a push to main only, so a red run publishes nothing. `coverage`
  # (Codecov) is left out on purpose: a missing CODECOV_TOKEN must not
  # block the reports.
  pages-deploy:
    name: deploy reports
    needs: [test, contract, lint, govulncheck, generated-code-is-fresh]
    if: >-
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reports
      - name: Assemble reports
        run: ./scripts/build-reports.sh _site/pipeline-analytics-sdk-go
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
